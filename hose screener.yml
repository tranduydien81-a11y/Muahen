# Doi ten thu muc chua file nay thanh ".github/workflows/" khi day len repo
# (GitHub yeu cau dung ten thu muc nay de nhan dien workflow).
name: HOSE Screener hang ngay

on:
  schedule:
    # 08:15 UTC = 15:15 gio Viet Nam (sau khi dong cua HOSE 15:00)
    - cron: "15 8 * * 1-5"   # Thu Hai - Thu Sau
  workflow_dispatch: {}      # cho phep bam chay tay tren GitHub / app di dong

jobs:
  chay-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Chay screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python hose_3tang.py
